# Tabla por objeto (secciones 4 y 6.4 del PDF). Medidas y pesos confirmados el 2026-10-12; el agarre,
# FORCE_SET y SPEED se miden en el hito 2 con la bascula (herramientas/fuerza_mano.py) y se apuntan aqui.
#   forma: esfera (medidas = [diametro]), caja (medidas = [largo, ancho, alto], largo en x del objeto),
#          cilindro de pie (medidas = [diametro, alto])
#   simetria_deg: el yaw en planta se da modulo esto (0 = sin orientacion medible)
#   color: rangos HSV de OpenCV (H 0-179); se ajustan con las imagenes reales del hito 2
#   agarre: los que se prueban, en orden: arriba (palma abajo) | lado (palma vertical, dedos 15-55 grados abajo)
#   force_set: gf por DOF [menique, anular, medio, indice, pulgar flexion, pulgar rotacion]; -1 = no cierra
#   bandeja: la que le toca, por color (o nombre A-D) de montaje.yaml; --asignacion la cambia. Orden fijado
#            por el usuario el 2026-10-17: cilindro azul -> roja, pelota amarilla -> blanca, cubo blanco ->
#            naranja, prisma naranja -> azul. La pelota de tenis se cambio el 2026-11-12 por una esfera de PLA
#            gris de 6 cm (montajes/objetos/), con la misma bandeja.

objetos:
  esfera:
    # con 0.045 y dos dedos (§77), los dedos recogidos apoyaban en su hombro al bajar y rodo (§78-79). A 0.050 (§79) la
    # mano entra con la palma a ~35 grados (el borde de palma_abajo_tol_deg) y, en el gemelo con las q medidas, el
    # pulgar la toca a +18-22 grados sobre el ecuador: la apretaba hacia abajo, fuera de la pinza, y se escurrio al
    # levantar (§80). A 0.040: pulgar en el ecuador (-4 a +2), indice -6 a +5 y medio -8 a -14; los dedos, a 7-11 mm de
    # la mesa al cerrar y 17-26 en la bajada; el anular recogido, a 14-16 mm de la esfera (a 0.050, ~20).
    # La de 7 cm (§91), en el gemelo con el montaje de las 10:00: a 0.040 pulgar -7, indice -1, medio -9 y los dedos a
    # 7.5 mm de la mesa; a 0.045, -2/0/-8 y 12.7 mm; a 0.050 el pulgar ya pasa del ecuador (+4 a +6). 0.043: en el
    # ecuador o algo debajo, con ~10 mm a la mesa
    altura_agarre_m: 0.043
    nombre: esfera de PLA gris
    forma: esfera
    # 7 cm desde el 2026-11-18 (§91; antes, una de 6 cm, 41.4 g): con la mano menos cerrada al tocarla y mas sitio
    # bajo el ecuador. La percepcion la da con 0.94 (con el radio de la de 6, 0.88 y 3 mm corrida)
    medidas_m: [0.070]
    masa_kg: 0.066               # estimada (la de 6 cm por (7/6)^3): pesarla
    simetria_deg: 0
    # gris azulado. Mide como el cubo y la forma no los separa con la profundidad real (la tapa del cubo sale tan
    # poco plana como una esfera, RESULTADOS §53): los separa el color. En la camara del robot (dataset esfera_cubo
    # del 2026-11-12, §54), 5-95 %: H 93-107, S 24-59, V 47-136 (mas oscura que en las fotos); el cubo blanco, S 4-8
    # (las caras en sombra, calidas, hasta 75) y V 255. Esfera 0.94 de su color y 0 del del cubo (50/50 fotogramas)
    color: {nombre: gris, hsv_min: [85, 15, 35], hsv_max: [115, 90, 255]}
    agarre: [arriba, lado]
    # tres dedos, como el cubo (z 0.028): el pulgar y el indice cerca de su eje y el medio al otro lado. Que gire en la
    # mano no importa (es una esfera) y el empuje de lado del medio la mete en la pinza: queda encerrada entre el
    # pulgar y la V de indice y medio, bajo el ecuador. Con dos dedos, el medio recogido quedaba a 22 mm de su eje,
    # sobre su hombro (§79). De lado no hay plan: la mano entra a 1-5 mm de las bandejas C y D
    # Con la de 7 cm (§92), tambien el anular: en el gemelo, a lo ancho de la mano, el pulgar y el indice la tocan a
    # +5 mm de su centro y el medio a -8; el pulgar la empujaba hacia el lado del medio, donde no habia nada, y rodaba
    # alejandose del indice (su fuerza bajaba de 472 a 38 gf en 8 s de transporte, la del medio subia) hasta caer. El
    # anular la toca a -26 mm, bajo el ecuador (-26 grados): le cierra ese lado. Con 200 (el derecho tiene 392 gf de
    # residuo, que se suma al FORCE_SET): de tope, sin empujarla de lado
    force_set: [-1, 200, 300, 300, 450, -1]
    # el pulgar cierra a ~320 cuentas/s con SPEED 100 y el indice y el medio a ~145 (manos.csv, §80): llegaba a la
    # esfera ~0.7 s antes y la empujaba rodando el solo. A 60 (~178/s) llegaban a la vez, pero con unos mm de diferencia
    # el pulgar tocaba primero (609, los dedos en 686) y, al oponerse al indice y no al centro de la V con el medio, la
    # sacaba de lado (§86). A 45 (~134/s) llegan antes el indice y el medio (~0.5 s): la empujan recta hacia la palma y
    # el pulgar la atrapa
    speed_cierre: [100, 100, 100, 100, 45, 100]
    preforma: cuatro_dedos
    centro_agarre: {arriba: [0.211, -0.070, 0.028], lado: [0.211, -0.065, 0.028]}
    bandeja: blanca
  cubo:
    # del punto de agarre sobre la mesa. Con 0.035 las yemas del medio y el indice apretaban a 4-11 mm de la mesa y el
    # pulgar a ~26: la pinza por debajo del centro de masas (30 mm), y el cubo volcaba dentro de la mano al levantarlo
    # (camara externa, §61). Con 0.055: medio ~24, indice ~31, pulgar ~46 mm (las yemas, 31/24/9 mm bajo el punto),
    # y la linea pulgar-indice, sobre la que gira el cubo, solo ~8 mm por encima del centro de masas (§64). Con 0.058:
    # medio ~27, indice ~34, pulgar ~49 (11 mm bajo la tapa); la linea, a ~11.5 mm
    altura_agarre_m: 0.058
    nombre: cubo de PLA
    forma: caja
    medidas_m: [0.060, 0.060, 0.060]
    masa_kg: 0.0605
    simetria_deg: 90
    guinada_tol_deg: 30          # si no hay plan alineado (6 cm de cara: a 30 grados, 6.9 de cuerda)
    # blanco; sus caras en sombra salen calidas (H 11-53, S hasta 75, V desde ~60): con S <= 14 (§53) solo la mitad
    # de sus puntos casaban y la confianza no pasaba de 0.5 (el nivel 2 no lo cogia, §55). Lo separa de la esfera
    # gris azulada el tono (H <= 60 frente a 93-107): confianza 0.84 (esfera_cubo) y 0.81 (objetos_a del 18-oct)
    color: {nombre: blanco, hsv_min: [0, 0, 60], hsv_max: [60, 80, 255]}
    agarre: [arriba, lado]
    # tres dedos: 295/179/341 gf estable en banco; dos dedos gira. El pulgar: con 350 cedia (de 415 a 595) ante el
    # indice y el medio (300 + 300) (§60); con 575 (+ ~225 de compensacion = el tope de 800) marcaba ~800 al levantar y,
    # al volcar el cubo, 1571 gf: el corte de 1200 hizo la salida segura y lo solto (§61)
    force_set: [-1, -1, 300, 300, 450, -1]
    preforma: tres_dedos
    # tres_dedos: el centro en la pinza (indice y medio contra el pulgar), no en el de los cuatro dedos de `agarres`
    # (z 0.010): las yemas cierran en z +0.034 el indice, +0.011 el medio y +0.032 el pulgar (mallas, mano cerrando
    # sobre el cubo); con 0.010 el pulgar y el indice apretaban a 6-8 mm del borde, la pinza pasaba a 2 cm del centro
    # de masas y el cubo giraba y se escapaba (RESULTADOS §58). Con 0.026 (la pinza con la resultante de indice y
    # medio) el pulgar, enfrente del indice, hacia con el de pivote: el centro de masas, 7 mm hacia el medio, colgaba y
    # el cubo giro ~35 grados en la pinza al levantarlo (camara externa, §64). Con 0.030, 3 mm hacia el medio: el
    # indice y el pulgar, a 2-4 mm del centro de la cara, y el medio a 1 cm de su borde, sujetando ese poco
    centro_agarre: {arriba: [0.211, -0.070, 0.030], lado: [0.211, -0.065, 0.030]}
    # la posicion y el yaw, con la tapa en la imagen de color (la mancha blanca saturada, retroproyectada a 6 cm sobre
    # la mesa): la profundidad del cubo blanco tiene un hueco en la tapa y lo ponia hasta 2.2 cm al lado (§59)
    tapa_color: {v_min: 235, s_max: 60}
    # se suelta mas abajo que la planificacion.altura_suelta_m comun (0.10): con ella la base quedaba a 3-4 cm del
    # fondo y el cubo, colgando ~10 grados inclinado en la pinza, caia de canto y se quedaba apoyado en la pared del
    # fondo de la bandeja (§88). Con 0.075, la base a ~1.5 cm del fondo; las yemas (2.7-4.9 cm sobre la base), a
    # 4.2-6.4 cm de la mesa, por dentro de las paredes (4 cm, a ~2 cm de las caras del cubo)
    altura_suelta_m: 0.075
    bandeja: naranja
  cilindro:
    # la pinza pulgar-indice por encima del centro de masas (40 mm) y por su eje. De lado no hay IK con el montaje de hoy
    # (en el gemelo, 0 de 8 sitios de la zona): desde arriba. Con 0.050 y los cuatro dedos, la linea pasaba a ~33 mm (por
    # debajo: vuelca, §61); con 0.068 y tres dedos, a ~51, y aun asi giro (§69). Con 0.072: pulgar ~63 (17 mm bajo la
    # tapa), indice ~48; la linea a ~55, 15 mm sobre el centro de masas
    altura_agarre_m: 0.072
    nombre: cilindro de PLA
    forma: cilindro
    medidas_m: [0.050, 0.080]
    masa_kg: 0.0329                            # el usuario, 2026-11-12
    simetria_deg: 0
    color: {nombre: azul, hsv_min: [95, 100, 50], hsv_max: [130, 255, 255]}
    agarre: [arriba]
    # dos dedos, el pulgar enfrente del indice y el eje entre los dos (z 0.033): en una superficie redonda la pinza lo
    # centra en su linea. Con tres (§68-69), el medio apretaba a 19 mm del eje, de lado (a ~50 grados de la pinza):
    # empujaba la parte baja del cilindro hacia el indice con el pulgar arriba, y giro ~50 grados en la mano al
    # levantarlo hasta soltarse. En el cubo el medio aprieta una cara plana: sin empuje de lado
    force_set: [-1, -1, -1, 300, 450, -1]
    # el indice a SPEED 60 (§93): tocaba antes que el pulgar llegara a su tope, empujaba el cilindro y el brazo cedia 8 mm
    # de lado (la pinza fuera del eje, §87); asi el pulgar llega antes y el indice lo aprieta contra el
    speed_cierre: [100, 100, 100, 60, 100, 100]
    preforma: dos_dedos
    # y -0.075 (el cubo, -0.070): el pulgar llega por -y y el indice por +y (marco de la muneca). Con -0.070, el
    # cilindro (radio 25 frente a los 30 del cubo) dejaba el pulgar en su tope (303; consigna 300) sin apretar: hacia
    # de tope y el cilindro giro y bajo por el indice hasta soltarse (§71). 5 mm hacia el pulgar: lo toca donde al
    # cubo (~400) y el indice cierra ~5 mm mas (tiene recorrido)
    # z 0.033 -> 0.040 (arriba): la pinza quedaba a un lado del eje (~1 cm por -y del torso). Sobre la mesa no se nota;
    # al despegar, el cilindro giraba 22-28 grados en la pinza y caia (§87). Se ve en las fuerzas: el indice, 46-109 gf
    # mas que el pulgar y mas cerrado (703-711); en las buenas, iguales y en 716-717. Con 0.038 (la mano +4.5 mm en y
    # del torso; su z es ~-y del torso) se colocaron los dos, pero aun girando 7-17 grados hacia el mismo lado (§88):
    # 0.040, +6.4 mm (con 0.041, en el simulado de esa tirada, el cilindro en x 0.54 se quedaba sin IK)
    centro_agarre: {arriba: [0.211, -0.075, 0.040], lado: [0.211, -0.070, 0.033]}
    bandeja: roja
  prisma:
    # TUMBADO (el de pie es prisma_de_pie, §94): 4 cm de alto, centro de masas a 20 mm). Con 0.030 el medio quedaba a la altura de la mesa (§61). Con
    # 0.042 (yemas del cubo: 9/24/31 mm bajo el punto): pulgar ~33 (7 mm bajo la tapa), indice ~18, medio ~11; la
    # linea pulgar-indice a ~26, por encima del centro de masas (§73)
    altura_agarre_m: 0.042
    nombre: prisma de PLA
    forma: caja
    medidas_m: [0.100, 0.040, 0.040]
    masa_kg: 0.0478                            # el usuario, 2026-11-12
    simetria_deg: 180
    guinada_tol_deg: 35          # si no hay plan alineado (4 cm de ancho: a 35 grados, 4.9 de cuerda)
    color: {nombre: naranja, hsv_min: [3, 120, 100], hsv_max: [24, 255, 255]}
    agarre: [arriba, lado]
    # tres dedos, como el cubo (caras planas: el medio aprieta de frente, sin el empuje de lado del cilindro, §69; y
    # sujeta el prisma, de 10 cm, a lo largo). De 4 cm de ancho: el pulgar llega a su consigna de cierre (300) y hace de
    # tope; aprietan el indice y el medio (con el cilindro de 5 cm ya llegaba, §72). 48 g: 250/250, y 400 el pulgar.
    # Con 250 se sostenia porque el reapriete de cada 1 s subia la fuerza a 600-800 gf; sin el (§84) quedo con ~290/200
    # y se salio a los 3.6 s de levantarlo (§85): 400/400. Con 400 el apriete se aflojaba en el transporte (el medio de
    # 372 a 202 gf) y se solto sobre la bandeja (§92); el indice y el medio, cerrando a la vez que el pulgar, se
    # bloqueaban en un pico (hasta 1053 gf) y luego cedian. Con 450/450 y el indice y el medio a SPEED 60 (§92), el
    # pulgar llego antes a su tope, pero al llegar el medio el prisma giro y el indice se quedo sin apretar (157 gf) y
    # se solto en los dos intentos (§93): vuelta a 400/400 a la velocidad de siempre. Tumbado el agarre va justo: de
    # pie (prisma_de_pie), con dos dedos
    force_set: [-1, -1, 400, 400, 400, -1]
    preforma: tres_dedos
    # z 0.030, como el cubo (§64). Con 0.036 (§89: el indice y el medio quedaban ~8 mm hacia -y a lo largo del
    # prisma) quedaron centrados, pero se solto en los dos intentos de §91 (los dedos resbalaron hacia arriba sin
    # levantarlo, el pulgar con su menor fuerza: ~170-210 gf netos); con 0.030 se coloco en 4 de 5. Vuelta a 0.030
    centro_agarre: {arriba: [0.211, -0.070, 0.030], lado: [0.211, -0.065, 0.030]}
    # la posicion y el yaw, con la tapa en la imagen de color: la profundidad de la tapa naranja (muy clara en el IR)
    # da 14 mm en vez de 40. La tapa, iluminada, tiene brillo 246-250; la cara de delante, 150-187 (§74)
    tapa_color: {hsv_min: [3, 120, 220], hsv_max: [24, 255, 255]}
    bandeja: azul
  prisma_de_pie:
    # el mismo prisma DE PIE (§93-94), 4 x 4 x 10 cm: la percepcion lo separa del tumbado por el alto (102 mm frente a
    # 40) y el supervisor los trata como un objeto (variante_de: la misma bandeja y los mismos intentos)
    variante_de: prisma
    # A 0.090 (como el cilindro, 8-10 mm bajo la tapa): pulgar ~81 mm, indice ~66; la linea a ~73, 23 mm sobre el
    # centro de masas (50): cuelga estable
    altura_agarre_m: 0.090
    nombre: prisma de PLA de pie
    forma: caja
    medidas_m: [0.040, 0.040, 0.100]
    alto_min_m: 0.080            # la profundidad lo ve de 101-103 mm; con 0.55 del alto, la bola de espuma (52) pasaba
    masa_kg: 0.0478
    simetria_deg: 90
    guinada_tol_deg: 30          # si no hay plan alineado (como el cubo)
    color: {nombre: naranja, hsv_min: [3, 120, 100], hsv_max: [24, 255, 255]}
    agarre: [arriba]
    # dos dedos, como el cilindro: un solo dedo enfrente del pulgar aprieta en linea (el cilindro, ~500/470 gf); tumbado,
    # con tres, el reparto entre el indice y el medio no aguantaba (§93). Con 4 cm, como con el cilindro de 5, el pulgar
    # llega a su tope. A la vez el pulgar y el indice (SPEED 100): con el indice mas lento (60), el pulgar esperaba en su
    # tope a ~1 cm de la cara y el indice empujaba el prisma solo: un prisma de pie de 10 cm vuelca antes que deslizar
    # (~13 gf a 7 cm de alto) y no se cogio en ninguno de los dos intentos (§94)
    force_set: [-1, -1, -1, 300, 450, -1]
    preforma: dos_dedos
    # y -0.080: 5 mm mas cerca del pulgar que el cilindro (4 cm frente a 5), para que su cara quede donde para el
    # pulgar. z 0.033: con 0.040 (el del cilindro), en el gemelo con las q medidas el pulgar tocaba a +14-17 mm del
    # centro de la cara (la arista, a 20) y el indice a +1-3; en el robot no la toco (§94)
    centro_agarre: {arriba: [0.211, -0.080, 0.033], lado: [0.211, -0.075, 0.033]}
    # la tapa de arriba, de 4 x 4, en la imagen de color, como la del tumbado (§74)
    tapa_color: {hsv_min: [3, 120, 220], hsv_max: [24, 255, 255]}
    bandeja: azul

# Agarre en el marco de la mano (*_wrist_yaw_link; izq: dedos en +x, palma hacia -y, indice en +z; la
# derecha es el espejo en y). El centro del objeto queda en `centro` (la y se cambia de signo en la
# derecha); se ajusta con el gemelo y el robot en el hito 2. x: 0.215 con la mano montada en x=0.165; 0.211
# desde que esta como en el robot (anillo adaptador de 10 mm y brida de 16 mm: montaje en x=0.161, 4 mm mas
# cerca de la muneca; README de h1_2_inspire_description, commit 0d5e452).
# Es el centro de los cuatro dedos; un objeto puede llevar el suyo (`centro_agarre`: el de tres_dedos, en la pinza).
agarres:
  arriba:   {centro: [0.211, -0.070, 0.010]}
  lado:     {centro: [0.211, -0.065, 0.010]}

# Preformas en ANGLE_SET (0 cerrado, 1000 abierto) antes de bajar; el cierre va a 0 con FORCE_SET.
preformas:
  abierta_opuesta: [1000, 1000, 1000, 1000, 1000, 0]    # pulgar girado enfrente de los dedos
  tres_dedos:      [0, 0, 1000, 1000, 1000, 0]          # menique y anular recogidos
  cuatro_dedos:    [0, 1000, 1000, 1000, 1000, 0]       # solo el menique recogido (la esfera de 7 cm, §92)
  dos_dedos:       [0, 0, 0, 1000, 1000, 0]             # pulgar e indice: menique, anular y medio recogidos (cilindro)
  senalar:         [0, 0, 0, 1000, 600, 500]            # nivel 1: solo el indice extendido
