# H1-2 (robotics40): solo la D435i de la cabeza, por ZMQ (sin WebRTC). Original en cam_config_server.yaml.orig
webrtc:
  bitrate:
    min: 2000000
    default: 5000000
    max: 12000000
  gop_length: 60
head_camera:
  enable_zmq: true
  zmq_port : 55555
  enable_webrtc: false
  webrtc_port : 60001
  webrtc_codec: h264
  type: realsense
  image_shape: [480, 640]
  binocular: false
  fps: 30
  video_id: null
  serial_number: "134322071879"
  physical_path: null
left_wrist_camera:
  enable_zmq: false
  zmq_port : 55556
  enable_webrtc: false
  webrtc_port : 60002
  webrtc_codec: h264
  type: uvc
  image_shape: [480, 640]
  binocular: false
  fps: 30
  video_id: null
  serial_number: null
  physical_path: null
right_wrist_camera:
  enable_zmq: false
