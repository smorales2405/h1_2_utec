      L_shoulder_pitch: {kp: 280.0, kd: 13.5}
      L_shoulder_roll:  {kp: 280.0, kd: 13.5}
      L_shoulder_yaw:   {kp: 126.0, kd: 13.5}
      L_elbow:          {kp: 126.0, kd: 13.5}
