# s = 1 - ANGLE_SET/1000: 0 = open, 1 = closed (ANGLE_ACT reads on the same scale).
# Every curve gives one joint in rad, URDF convention, at the nodes in `s`; read it by linear
# interpolation in between. Every curve starts at 0: q = 0 is the open hand. Both hands use
# the same curves: the right hand's joints are mirrored so that the same q gives the mirrored
# pose.
# Read by: urdf/inspire_hand_*.urdf.xacro (limits, coupling:=software), scripts/hand_coupling.py.

