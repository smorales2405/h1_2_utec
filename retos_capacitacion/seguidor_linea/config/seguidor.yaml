# Configuracion del seguidor de linea del H1-2 (reto R40-RT-H1_2-0001).
# Ganancias, limites y tiempos viven aqui, no en el codigo (seccion 5 del PDF).
# La geometria de la camara la escribe herramientas/calibrar_camara.py en
# config/geometria.yaml, que pisa la seccion `geometria` de este fichero.

red:
  iface: eth0                             # DDS de Unitree: solo por el cable interno del robot
  zmq_fotogramas: tcp://127.0.0.1:5556    # camara_servidor.py (root) -> procesos del usuario

camara:
  fps: 30
  ancho: 640
  alto: 480
  color: false          # el IR izquierdo va siempre; el color y la profundidad, si se piden
  profundidad: false
  emisor: false         # con el emisor encendido se ven sus puntos sobre la cinta
  puerto_video: 5000    # mosaico de depuracion en http://<robot>:5000 (0 = sin video)

geometria:              # valores de una sola captura del 2026-10-02; calibrar en el Hito 1
  calibrada: false
  altura_m: 1.68
  inclinacion_deg: 51.7
  roll_deg: 0.0
  yaw_deg: 0.0          # yaw de la camara respecto del cuerpo: sin medir
  imu_roll_ref_deg: 0.0 # roll y pitch de la IMU del torso cuando se calibro
  imu_pitch_ref_deg: 0.0
  x_puntera_m: null     # distancia de la vertical de la camara a la puntera: medir

percepcion:             # seguidor/percepcion.py (Hito 2)
  resolucion_m: 0.01    # vista desde arriba: 1 cm por pixel
  x_min_m: 0.20         # franja del suelo que se mira (m desde la vertical de la camara)
  x_max_m: 3.0
  y_max_m: 1.0          # +-1 m a los lados
  ancho_cinta_m: 0.05
  polaridad: auto       # auto | oscura | clara
  umbral: adaptativo    # adaptativo (k veces el ruido de la franja) | fijo (niveles de gris)
  umbral_sigmas: 6.0
  umbral_minimo: 6.0    # niveles: por debajo nunca es linea, aunque el ruido sea muy bajo
  umbral_fijo: 15.0
  contraste_ref: 40.0   # niveles de contraste pleno para la confianza: la cinta negra da 42-45 (p10 35-39), la blanca 68
  franjas_m: [[0.20, 0.8], [0.8, 1.5], [1.5, 2.5], [2.5, 3.0]]
  franja_vista: 0.3     # fraccion de filas con linea para dar la franja por vista
  tolerancia_ajuste_m: 0.04
  hueco_max_m: 0.5     # la linea se corta en el primer hueco mayor (la interrupcion del nivel 3 es de 0.4 m)
  hueco_salto_max_m: 1.0  # ...salvo que lo de mas alla siga la prolongacion (reflejos de focos: 50-60 cm)
  inicio_lejano_m: [0.9, 1.6]   # una linea que empieza mas lejos que esto pierde la confianza (de 1 a 0 entre los dos)
  distancia_objetivo_m: 1.0   # punto adelantado del pure pursuit
  ventana_local_m: 0.8  # la linea para el control se reajusta con lo que hay hasta aqui: con una recta y una curva
                        # cerrada en la misma vista, la parabola entera sesgaba el angulo hasta +24-29 grados
                        # (nivel 2, 2026-11-06); con 0.8 m, +1-4. 0 = sin reajuste
  peso_cercana: 0.9     # la confianza tambien puede salir solo de esa linea cercana (x factor): en la S con el hueco
                        # y la sombra seguidos, lo lejano no cabe en una parabola y la de toda la vista caia a 0.2-0.3
  barra_cobertura: 0.55       # fraccion de +-35 cm alrededor de la linea cubierta por cinta transversal
  barra_grosor_max_m: 0.12
  barra_sigmas: 4.0

estimacion:             # seguidor/estimacion.py (Hito 3); valores medidos en RESULTADOS.md
  desfase_imu_s: 0.010  # la IMU, 10 ms antes de que llegue el fotograma (apartado 4)
  postura_s: 1.5        # media de roll y pitch del torso: la postura, no el balanceo del paso
  factor_velocidad: 1.14     # v real / vx mandado (0.228 m/s con vx 0.2, apartado 3)
  direccion_avance_deg: 7.5  # el robot avanza 7.5 grados a la izquierda del eje de la camara
  centro_giro_m: 0.14   # gira alrededor de un punto ~14 cm por detras de la camara (8-18 cm)
  tau_velocidad_s: 0.5  # la marcha tarda ~0.5 s en llegar a la vx mandada (como el giro: supuesto)
  v_minima: 0.18        # andando no baja de esto (tiradas: vx 0.116 -> 0.17-0.20 m/s). En la curva de 1 m a media
                        # escala, sin esto el control pide menos giro del necesario: pies a 13.7 cm en vez de 3.5
  conf_usar: 0.35       # medidas con menos confianza no mueven la linea estimada
  asentar_s: 1.5        # tras cambiar la vx mandada, la marcha tarda ~1-1.5 s en llegar: la velocidad medida
                        # con la barra solo cuenta pasado esto (2026-11-06: medida antes de frenar, FIN 17-25 cm pronto)
  paso_linea_m: 0.05
  confirmar: 5          # avistamientos seguidos para dar por buena la barra o la esquina
  tolerancia_m: 0.25    # un avistamiento nuevo a mas de esto del anterior empieza de cero
  puerta_m: 0.25        # una medida a mas de esto de la linea predicha (a 0.5 m)...
  puerta_deg: 25.0      # ...o mas girada que esto no se usa (falsos: cantos de muebles, 2026-10-05)...
  puerta_edad_s: 1.0    # ...mientras la estimacion tenga menos de esto (despues se readquiere)
  readquirir: 3         # una linea distinta de la estimada se adopta con 3 medidas seguidas coherentes

control:                # seguidor/control.py (Hito 3): pure pursuit sobre la direccion real de avance
  vx: 0.40              # m/s en recta; --escala 0.5 (primeras tiradas) la deja en 0.2
  vy: 0.0
  distancia_objetivo_m: 0.6  # punto adelantado, desde el centro de giro (simulador: 1.0 recorta 16 cm en el nivel 3, 0.6 menos de 6)
  ganancia_pp: 1.0      # vyaw = ganancia * 2 v sin(alfa) / L
  vyaw_sesgo: -0.026    # rad/s andando: compensa la deriva a la izquierda (~1.5 grados/s)
  ki: 0.0               # integral del angulo al objetivo (rad/s por rad s)
  k_curvatura: 0.5      # vx / (1 + k |curvatura pedida|)
  conf_minima: 0.3      # por debajo, vx = 0
  conf_plena: 0.5       # por encima, vx completa (con reflejos o sombras de patas la cinta da 0.5-0.6, 2026-10-06)
  frenar_alfa: true     # vx * cos(alfa): mas despacio cuanto mas torcido
  pausa_giro_deg: 25.0  # si el giro no cabe ni a la velocidad minima de la marcha y |alfa| pasa de esto, para y gira
                        # en el sitio hasta la mitad (0 = no). Media escala en la S de 1 m: vyaw al tope 13 s, 20 cm fuera
  pausa_perdida_deg: 15.0  # con la linea perdida, si la estimada va a un lado mas que esto, para y gira hacia ella
                           # hasta la mitad (0 = no): en la S de 1 m seguia andando recto mientras la cinta se curvaba
  pausa_perdida_rumbo_deg: 18.0  # ...o si la cinta estimada va a mas de esto de la marcha (alfa pequeno: el objetivo
                                 # en la prolongacion recta de la curva); gira hasta alinearse con ella (0 = no)
  pausa_perdida_rumbo_edad_s: 0.8  # ...pero solo con la linea perdida desde hace esto: las perdidas breves se
                                   # recuperan andando (simulado: parar en cada una aparta el robot hasta 17 cm)
  vyaw_busqueda: 0.25   # si la pausa con la linea perdida acaba (alineado con la estimada) y sigue sin verse, sigue
                        # girando a esto hacia el mismo lado hasta verla (0 = anda): la cinta de la curva sigue doblando
  vx_busqueda: 0.16     # ...andando a esto (arco de ~0.7-1 m, como si la curva siguiera; 0 = en el sitio, que no
                        # cruza un hueco en curva: nivel 3 del PDF simulado)
  vx_tras_pausa: 0.16   # tras una pausa, no mas de esto durante t_tras_pausa_s (0 = no): sin acelerar en la curva
  t_tras_pausa_s: 2.0
  girar_primero_deg: 12.0  # al empezar, si |alfa| pasa de esto, girar en el sitio hasta la mitad antes de andar
                           # (0 = no; --girar-primero). Es un umbral: lo que gira sale de alfa. Alineado, |alfa| ~7.5
                           # por el avance en diagonal. Los pies se alejan 0.6 y 2.0 cm con giro, 7.0 y 9.7 sin el
  dvx_max: 0.5          # m/s^2: rampa de vx (la de frenado es el doble)
  dvyaw_max: 1.0        # rad/s^2: cambio maximo del giro mandado
  cerca_barra_m: 1.6    # a menos de esto de la barra... (antes de que un reflejo la tape, ~0.7 m, ya va despacio)
  vx_cerca_barra: 0.6   # ...la vx se multiplica por esto

limites:                # seccion 10 del PDF; robot.py ademas aplica estos topes por su cuenta
  vx_max: 0.4
  vy_max: 0.2
  vyaw_max: 0.5
  escala_primeras: 0.5  # las primeras tiradas de cada nivel, a la mitad

supervisor:
  hz_ordenes: 20
  inclinacion_max_deg: 20
  lowstate_max_s: 0.5
  fotograma_max_s: 0.5  # sin fotogramas mas tiempo que esto -> parada (a ajustar)
  palabra: SEGUIR
  boton_parada: null    # elegir con lectores.sh mando-vivo: uno sin funcion en FSM 201 (R1, L1...)
  conf_seguir: 0.45     # ESPERA -> SEGUIMIENTO con `n_seguir` medidas seguidas por encima
  n_seguir: 5
  t_inicio_max_s: 5.0   # sin linea en este tiempo tras SEGUIR -> parada
  t_aviso_s: 0.3        # sin medida buena mas que esto -> LINEA_PERDIDA
  t_perdida_s: 4.5      # y mas que esto -> parada: (0.4 m de hueco + 0.2 de zona ciega) / 0.18 m/s (la marcha no baja
                        # de ahi) ya son 3.3 s; con 3 s la S del nivel 3 con sombra tras el hueco paraba (simulador)
  vx_perdida: 0.6       # factor de vx en LINEA_PERDIDA (se sigue la linea estimada, rumbo por la IMU)
  final_ciego_m: 0.6    # con la barra (o la esquina) a menos de esto, no ver la linea es lo normal (zona ciega)
  t_final_max_s: 6.0    # ...pero ese tramo a ciegas no dura mas de esto (a 0.14 m/s son ~2.5 s)
  fin_objetivo_m: 0.10  # la puntera debe acabar esto mas alla del borde cercano de la barra (el PDF admite 0-30 cm)
  t_frenado_s: 0.5      # tras StopMove el robot anda ~v x esto: MEDIR en las primeras tiradas
  giro_esquina_kp: 1.2  # nivel 4: giro de 90 grados en el sitio sobre la IMU, como cuadrado.py
  giro_esquina_min: 0.15   # en el sitio, por debajo de ~0.15 rad/s apenas gira
  giro_esquina_tol_deg: 3.0
  giro_esquina_estable_s: 0.6
  t_parado_s: 1.0       # espera tras StopMove antes de girar en el sitio
  duracion_max_s: 120.0
  fsm_cada_s: 2.0       # lee la FSM en segundo plano; distinta de 201/204 -> parada

registro:
  carpeta: datos
  lowstate_cada: 5      # 1 de cada 5 rt/lowstate: ~100 Hz, como cuadrado.py
