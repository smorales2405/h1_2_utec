# Joint angles of the real RH56DFTP left hand, measured on photos at nine ANGLE_SET values.
#
# Photos: inspire_hand_interface/Caracterizacion/imagenes/angulos limite/{index,middle,ring,little,
#   thumb_bend,thumb_rot}_positions, one DOF moved at a time, the rest open (thumb rotation closed
#   in the finger and thumb-bending series). Method: this model was rendered in MuJoCo through a
#   virtual camera fitted to every photo (6 DOF pose, field of view from the EXIF focal length), then
#   the joints of the moving DOF were swept until the rendered silhouette matched the photographed
#   one. Each value comes with the interval where the silhouette cost stays within 5 % of its
#   minimum, used as the measurement's uncertainty by tools/fit_hand_coupling.py.
#
# Rows: [ANGLE_SET, q, q_lo, q_hi] per joint, in rad, URDF convention: q = 0 is the open hand,
# ANGLE_SET = 1000. Input of tools/fit_hand_coupling.py, which writes config/hand_coupling.yaml.
#
# The photos were fitted on the model as it was before the joint zeros were moved to the open
# hand, when q = 0 was the manual's open pose (alpha 176, theta 70, beta 165 deg). The values
# below were converted to the present zero by subtracting, from what the photos gave, the open
# pose that the fitted curves had in that old convention:
#   finger_1 0.0571, finger_2 0.0108, thumb_1 0.1257, thumb_2 -0.2074, thumb_3 -0.0868,
#   thumb_swing 0.0400 rad.
# The URDF joint origins were rotated by those same angles, so every pose is unchanged.

fingers:
  # [ANGLE_SET, q1, q1_lo, q1_hi, q2, q2_lo, q2_hi]
  index:
    # At 1000 the open index overlaps the other fingers in the photo and the fit locks on them
    # (q1 = 0.13). The open pose is measured instead on the four fingers together: open_stack.
    angles:
      - [ 875, 0.4329, 0.3929, 0.4929, 0.1092, 0.0092, 0.1692]
      - [ 750, 0.6629, 0.6229, 0.7329, 0.2792, 0.1592, 0.3192]
      - [ 625, 0.8429, 0.8029, 0.8829, 0.4692, 0.4092, 0.5492]
      - [ 500, 1.0329, 0.9929, 1.1029, 0.6292, 0.5092, 0.6692]
      - [ 375, 1.1029, 1.0329, 1.1729, 0.7992, 0.7092, 0.8692]
      - [ 250, 1.2729, 1.1929, 1.3129, 0.9392, 0.9092, 1.0592]
      - [ 125, 1.4129, 1.3629, 1.4829, 1.1392, 1.0492, 1.1692]
      - [   0, 1.5329, 1.4729, 1.6129, 1.3192, 1.2292, 1.3692]
  middle:
    # At 1000 the fit is not usable either (q1 = 0.30): the open finger overlaps the others.
    angles:
      - [ 875, 0.3729, 0.3029, 0.4129, 0.1492, 0.1092, 0.2692]
      - [ 750, 0.5229, 0.4629, 0.5429, 0.3392, 0.3092, 0.4492]
      - [ 625, 0.7029, 0.6429, 0.7629, 0.5392, 0.4592, 0.6192]
      - [ 500, 0.9329, 0.8729, 0.9929, 0.6792, 0.6092, 0.7692]
      - [ 375, 1.0229, 0.9729, 1.0929, 0.9292, 0.8192, 0.9692]
      - [ 250, 1.1629, 1.1329, 1.2229, 1.0492, 0.9592, 1.0692]
      - [ 125, 1.3029, 1.2229, 1.3729, 1.2292, 1.1592, 1.3192]
      - [   0, 1.4229, 1.3429, 1.4729, 1.4092, 1.3592, 1.4992]
  ring:
    angles:
      - [1000, 0.0629, -0.0171, 0.0929, -0.0508, -0.0908, 0.0692]
      - [ 875, 0.3329, 0.3029, 0.3529, 0.1592, 0.1192, 0.2192]
      - [ 750, 0.5629, 0.5429, 0.5929, 0.3792, 0.3192, 0.4192]
      - [ 625, 0.7829, 0.7629, 0.8129, 0.5292, 0.4692, 0.5692]
      - [ 500, 1.0029, 0.9729, 1.0229, 0.6492, 0.6092, 0.6992]
      - [ 375, 1.1329, 1.1129, 1.1629, 0.8292, 0.7792, 0.8592]
      - [ 250, 1.2229, 1.1929, 1.2429, 1.0292, 0.9892, 1.0692]
      - [ 125, 1.4229, 1.3929, 1.4529, 1.1092, 1.0592, 1.1492]
      - [   0, 1.5729, 1.5329, 1.6229, 1.2492, 1.1892, 1.2992]
  little:
    angles:
      - [1000, 0.0029, -0.0171, 0.0229, 0.0192, -0.0308, 0.0692]
      - [ 875, 0.3129, 0.2629, 0.3329, 0.2392, 0.2092, 0.3492]
      - [ 750, 0.6129, 0.5629, 0.6229, 0.3192, 0.3092, 0.4292]
      - [ 625, 0.8229, 0.7929, 0.8529, 0.4592, 0.3892, 0.5192]
      - [ 500, 1.0129, 0.9829, 1.0329, 0.6092, 0.5592, 0.6692]
      - [ 375, 1.1329, 1.1129, 1.1529, 0.7692, 0.7292, 0.8092]
      - [ 250, 1.2129, 1.2029, 1.2329, 1.0192, 0.9792, 1.0392]
      - [ 125, 1.4029, 1.3829, 1.4229, 1.1292, 1.0892, 1.1592]
      - [   0, 1.5029, 1.4829, 1.5229, 1.3892, 1.3492, 1.4092]
  # The four fingers open (ANGLE_SET = 1000), fitted together on the index_positions photos:
  # [ANGLE_SET, q1, q1_lo, q1_hi]
  open_stack: [1000, -0.0041, -0.0161, 0.0079]

thumb_bend:
