      - [ 875, 0.0743, 0.0543, 0.0943, 0.0074, -0.0526, 0.0474, 0.0468, 0.0268, 0.1268]
      - [ 750, 0.1743, 0.1543, 0.1743, 0.0674, 0.0674, 0.1674, 0.0468, -0.0732, 0.0468]
      - [ 625, 0.2743, 0.2543, 0.2743, 0.1074, 0.0874, 0.1674, 0.1268, 0.0268, 0.1468]
      - [ 500, 0.3743, 0.3543, 0.3743, 0.2074, 0.1874, 0.2674, 0.1268, 0.0468, 0.1468]
      - [ 375, 0.4243, 0.4243, 0.4443, 0.3074, 0.2474, 0.3274, 0.1468, 0.1268, 0.2468]
      - [ 250, 0.4943, 0.4743, 0.4943, 0.3474, 0.3474, 0.4274, 0.2068, 0.1268, 0.2468]
      - [ 125, 0.5743, 0.5543, 0.5743, 0.3074, 0.2674, 0.3674, 0.3468, 0.3268, 0.4268]
      - [   0, 0.6243, 0.6243, 0.6443, 0.3674, 0.3474, 0.4074, 0.3268, 0.2268, 0.3468]

thumb_rot:
  # [ANGLE_SET, thumb_swing, lo, hi]; fingertip view, thumb bending open.
  angles:
      - [1000, 0.0000, 0.0000, 0.0000]
      - [ 875, 0.1600, 0.1600, 0.1700]
      - [ 750, 0.3200, 0.3100, 0.3200]
      - [ 625, 0.5000, 0.5000, 0.5000]
